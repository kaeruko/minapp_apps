<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a52921">
  <title>町中華メモ | みんアプ工房</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: #332b22; background: #f5efdd;
      --red: #a52921; --deep: #76251e; --gold: #d9b45a; --jade: #1e695e; --ink: #342e27; --line: #decfae;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      background: radial-gradient(ellipse at 18% 8%, #fff9e7 0, transparent 40%),
        linear-gradient(160deg, #f9f1df, #f2e9d5);
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled, input:disabled, select:disabled, textarea:disabled { opacity: .53; cursor: not-allowed; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid #c9852b; outline-offset: 2px;
    }
    .app { width: min(100%, 600px); margin: 0 auto; padding-bottom: max(24px, env(safe-area-inset-bottom)); }
    header { background: var(--red); color: #fff6df; padding: max(22px, env(safe-area-inset-top)) 18px 19px; position: relative; overflow: hidden; }
    header::before, header::after { content: ""; position: absolute; width: 92px; height: 92px; border: 2px solid #f2d68c55; border-radius: 50%; }
    header::before { top: -42px; right: -18px; }
    header::after { bottom: -49px; left: -32px; }
    .header-inner { position: relative; z-index: 1; border: 1px solid #f4ce865c; padding: 17px 12px 18px; text-align: center; }
    .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .19em; color: #ffe0a3; margin: 0 0 6px; }
    h1 { font-size: clamp(28px, 8vw, 38px); line-height: 1.2; margin: 0; font-weight: 900; letter-spacing: .055em; }
    .subtitle { font-size: 13px; margin: 8px 0 0; line-height: 1.5; }
    .ornament { font-size: 20px; margin-bottom: 8px; }
    main { padding: 15px 13px 0; display: grid; gap: 14px; }
    .panel { border: 1px solid var(--line); background: #fffaf0; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 0 #a87f4910; }
    .panel-content { padding: 16px; }
    .section-label { display: flex; align-items: center; gap: 9px; color: var(--deep); font-size: 18px; font-weight: 900; margin: 0 0 15px; }
    .section-label::before { content: ""; width: 5px; height: 22px; border-radius: 5px; background: var(--red); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); padding: 16px 8px; gap: 5px; }
    .stat { text-align: center; border-right: 1px dashed #d9c49f; }
    .stat:last-child { border-right: 0; }
    .stat-value { display: block; font-size: clamp(23px, 7vw, 31px); color: var(--deep); font-weight: 900; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .stat-label { display: block; font-size: 11px; color: #735c42; font-weight: 700; margin-top: 6px; }
    .status { background: #e7f1e9; color: #26624e; padding: 12px 14px; border-radius: 10px; font-size: 13px; font-weight: 750; line-height: 1.6; overflow-wrap: anywhere; }
    .status.error { background: #f9e0d7; color: #912b24; }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .field { display: block; min-width: 0; font-size: 12px; font-weight: 800; color: #685138; }
    .field.full { grid-column: 1 / -1; }
    .field input, .field select, .field textarea {
      display: block; width: 100%; min-width: 0; margin-top: 5px; padding: 11px 10px;
      border: 1px solid #ccb891; border-radius: 9px; background: #fff; color: var(--ink); font-size: 16px;
    }
    .field textarea { min-height: 86px; line-height: 1.6; resize: vertical; }
    .field input::placeholder, .field textarea::placeholder { color: #a99479; }
    .favorite-check { display: flex; gap: 9px; align-items: center; border: 1px solid #ddc7a5; border-radius: 10px; background: #fff3d7; padding: 12px; font-size: 13px; font-weight: 800; color: #7a3a2d; margin-top: 13px; }
    .favorite-check input { width: 19px; height: 19px; accent-color: var(--red); margin: 0; }
    .buttons { display: flex; gap: 9px; margin-top: 14px; }
    .primary, .secondary { min-height: 47px; padding: 10px 12px; border: 0; border-radius: 10px; font-weight: 850; font-size: 14px; }
    .primary { flex: 1; background: var(--red); color: #fff9e9; }
    .secondary { flex: 0 0 auto; background: #ebdfc8; color: var(--deep); }
    .hidden { display: none !important; }
    .helper { color: #8c7355; font-size: 11px; line-height: 1.7; margin: 11px 1px 0; }
    .filters { display: grid; grid-template-columns: 1fr auto; gap: 9px; }
    .filters input[type="search"] { min-width: 0; width: 100%; border: 1px solid #ceb990; border-radius: 10px; padding: 10px 12px; font-size: 16px; background: #fff; }
    .filters select { border: 1px solid #ceb990; border-radius: 10px; padding: 9px; font-size: 13px; background: #fff; color: var(--ink); }
    .filter-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0 4px; }
    .filter-row label { display: flex; gap: 7px; align-items: center; font-size: 12px; font-weight: 800; color: #79512d; }
    .filter-row input { width: 17px; height: 17px; margin: 0; accent-color: var(--red); }
    .result-count { color: #876c4e; font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
    .records { display: grid; gap: 12px; margin-top: 12px; }
    .record { border: 1px solid #e1d2b7; border-radius: 12px; background: #fff; overflow: hidden; }
    .record-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; border-bottom: 1px dashed #eee0c9; padding: 13px 13px 10px; }
    .shop-title { font-size: 18px; font-weight: 900; margin: 0; overflow-wrap: anywhere; color: var(--deep); }
    .shop-area { margin: 5px 0 0; font-size: 12px; color: #806b51; overflow-wrap: anywhere; }
    .date-chip { flex: 0 0 auto; font-size: 11px; background: #f8ead1; color: #725131; padding: 5px 7px; border-radius: 6px; font-variant-numeric: tabular-nums; }
    .record-body { padding: 12px 13px 9px; }
    .dish-name { font-size: 16px; margin: 0 0 8px; font-weight: 850; overflow-wrap: anywhere; }
    .detail-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .chip { border-radius: 7px; padding: 5px 8px; background: #f4f1e9; color: #67583f; font-size: 12px; font-weight: 700; }
    .chip.star { background: #fff1cd; color: #996019; letter-spacing: .01em; }
    .chip.want { background: #fbe3dc; color: #a32e27; }
    .memo { font-size: 13px; line-height: 1.7; margin: 11px 0 4px; white-space: pre-wrap; overflow-wrap: anywhere; color: #6a5842; }
    .card-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid #eee4d4; }
    .card-actions button { border: 0; min-width: 0; padding: 11px 4px; background: #fffaf1; color: #765039; font-size: 12px; font-weight: 800; border-right: 1px solid #eee4d4; }
    .card-actions button:last-child { border-right: 0; color: #a72e28; }
    .card-actions button.active { color: #b33429; background: #fff1e9; }
    .empty { padding: 26px 10px 18px; color: #7e674c; font-size: 13px; text-align: center; line-height: 1.8; }
    footer { padding: 19px 16px 0; text-align: center; color: #8d7759; font-size: 11px; line-height: 1.6; }
    @media (max-width: 355px) {
      main { padding-left: 9px; padding-right: 9px; }
      .panel-content { padding: 12px; }
      .field-grid { gap: 9px; }
      .filters { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="header-inner">
        <div class="ornament" aria-hidden="true">🥟 ✦ 🍜 ✦ 🥢</div>
        <p class="eyebrow">MINAPP KOBO / 町のうまい店ノート</p>
        <h1>町中華メモ</h1>
        <p class="subtitle">ふらっと入った、あの店の味を忘れない。</p>
      </div>
    </header>
    <main>
      <section class="panel stats" aria-label="記録のまとめ">
        <div class="stat"><strong id="stat-visits" class="stat-value">—</strong><span class="stat-label">食べた記録</span></div>
        <div class="stat"><strong id="stat-shops" class="stat-value">—</strong><span class="stat-label">訪れたお店</span></div>
        <div class="stat"><strong id="stat-favorites" class="stat-value">—</strong><span class="stat-label">また行きたい</span></div>
      </section>
      <p id="status" class="status" role="status" aria-live="polite">個人の記録を読み込み中…</p>
      <section class="panel">
        <div class="panel-content">
          <h2 id="form-title" class="section-label">一皿を記録する</h2>
          <form id="record-form">
            <div class="field-grid">
              <label class="field full">お店の名前
                <input id="shop" type="text" maxlength="40" placeholder="例：駅前の大衆中華" autocomplete="off" required disabled>
              </label>
              <label class="field">場所・最寄り駅
                <input id="area" type="text" maxlength="50" placeholder="例：高円寺" disabled>
              </label>
              <label class="field">行った日
                <input id="visited-at" type="date" min="2000-01-01" max="2099-12-31" required disabled>
              </label>
              <label class="field full">食べた料理
                <input id="dish" type="text" maxlength="50" placeholder="例：麻婆豆腐" autocomplete="off" required disabled>
              </label>
              <label class="field">お会計（円・任意）
                <input id="price" type="number" inputmode="numeric" min="1" max="100000" step="1" placeholder="例：850" disabled>
              </label>
              <label class="field">満足度
                <select id="rating" required disabled>
                  <option value="5">★★★★★ 最高</option>
                  <option value="4">★★★★☆ おいしい</option>
                  <option value="3" selected>★★★☆☆ ふつう</option>
                  <option value="2">★★☆☆☆ もう少し</option>
                  <option value="1">★☆☆☆☆ 好みと違う</option>
                </select>
              </label>
              <label class="field full">ひとことメモ
                <textarea id="note" maxlength="140" placeholder="例：香りがよくてご飯が進む。お昼は並ぶかも。" disabled></textarea>
              </label>
            </div>
            <label class="favorite-check"><input id="favorite" type="checkbox" disabled>♡ また行きたいお店</label>
            <div class="buttons">
              <button type="submit" id="save-record" class="primary" disabled>＋ この一皿を保存</button>
              <button type="button" id="cancel-edit" class="secondary hidden" disabled>編集をやめる</button>
            </div>
          </form>
          <p class="helper">記録は本人だけに保存されます。食べた日ごとに同じお店を何度でも登録できます。</p>
        </div>
      </section>
      <section class="panel">
        <div class="panel-content">
          <h2 class="section-label">おいしい記録をめくる</h2>
          <div class="filters">
            <input id="search" type="search" placeholder="店名・場所・料理で探す" aria-label="記録を検索" disabled>
            <select id="sort" aria-label="並び順" disabled>
              <option value="recent">新しい順</option>
              <option value="rating">評価が高い順</option>
            </select>
          </div>
          <div class="filter-row">
            <label><input id="favorites-only" type="checkbox" disabled>♡ また行きたいだけ</label>
            <span id="result-count" class="result-count"></span>
          </div>
          <div id="records" class="records" aria-live="polite"></div>
          <p id="no-records" class="empty">まだ記録がありません。最初の一皿を書いてみよう。</p>
        </div>
      </section>
    </main>
    <footer>記録はみんアプ工房の個人用保存APIに保存されます。<br>気になる店の味を、少しずつ集めよう。</footer>
  </div>
  <script src="memo.js"></script>
  <script src="app.js"></script>
</body>
</html>
