<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8eb">
  <title>町中華メモ | みんアプ工房</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: #2f302e;
      background: #f7f1e7;
      --ink: #2f302e;
      --muted: #827566;
      --line: #e4dacc;
      --orange: #db883d;
      --orange-deep: #bb692a;
      --paper: #fffaf3;
      --field: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100dvh; background: #f7f1e7; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled, input:disabled, select:disabled, textarea:disabled { opacity: .52; cursor: not-allowed; }
    :is(button, input, select, textarea):focus-visible { outline: 3px solid #e5ad73; outline-offset: 2px; }
    .app {
      width: min(100%, 600px);
      min-height: 100dvh;
      margin: 0 auto;
      background: #fffaf3;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      box-shadow: 0 0 20px #58472b0b;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #fff8eb;
      border-bottom: 1px solid #e9decf;
    }
    .topbar-inner {
      min-height: 57px;
      padding: 7px 15px;
      display: grid;
      grid-template-columns: 61px 1fr 61px;
      align-items: center;
      gap: 5px;
    }
    .topbar-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: #f9ead4;
      font-size: 22px;
    }
    h1 { margin: 0; text-align: center; font-size: 16px; font-weight: 850; letter-spacing: .025em; color: var(--ink); }
    .save-button {
      border: 0;
      border-radius: 9px;
      background: var(--orange);
      color: #fff;
      font-size: 13px;
      font-weight: 850;
      padding: 9px 4px;
      min-height: 36px;
    }
    .save-button:not(:disabled):active { background: var(--orange-deep); }
    main { padding: 0 15px; }
    .intro { margin: 16px 2px 8px; font-size: 11px; color: var(--muted); font-weight: 650; }
    #record-form { scroll-margin-top: 79px; }
    .input-group { min-width: 0; padding: 0 1px; }
    .input-group + .input-group {
      margin-top: 18px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
    }
    .input-group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      line-height: 1.5;
      margin: 0 0 11px;
      font-weight: 850;
      color: #595145;
    }
    .group-kind {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 850;
      padding: 3px 7px;
      letter-spacing: .03em;
    }
    .group-kind.required { background: #f4e0ca; color: #99521b; }
    .group-kind.optional { background: #eeece6; color: #6f6960; }
    .group-hint { margin: -5px 0 12px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
    .field { display: block; min-width: 0; font-size: 12px; color: #3a352e; font-weight: 800; line-height: 1.45; }
    .field.full { grid-column: 1 / -1; }
    .field input, .field select, .field textarea {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 43px;
      margin-top: 5px;
      padding: 10px 11px;
      color: var(--ink);
      background: var(--field);
      border: 1px solid #d9cec0;
      border-radius: 9px;
      box-shadow: 0 1px 2px #6d58340a;
      font-size: 16px;
      line-height: 1.4;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: #d98c45;
      box-shadow: 0 0 0 2px #e9b98433;
      outline: none;
    }
    .field input::placeholder, .field textarea::placeholder { color: #a89d90; }
    .field textarea { min-height: 90px; resize: vertical; }
    .field select { padding-right: 3px; font-size: 13px; }
    .favorite-check {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 13px;
      margin-top: 13px;
      background: #fff1d8;
      border: 1px solid #f0d8b0;
      border-radius: 9px;
      color: #8b5425;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.4;
    }
    .favorite-check input { width: 18px; height: 18px; flex: 0 0 auto; margin: 0; accent-color: var(--orange-deep); }
    .buttons { display: flex; justify-content: flex-end; margin-top: 12px; }
    .secondary {
      min-height: 40px;
      border: 1px solid #e2d6c8;
      border-radius: 8px;
      padding: 8px 13px;
      background: #fff;
      color: #7b6251;
      font-size: 12px;
      font-weight: 800;
    }
    .hidden { display: none !important; }
    .helper { color: #958779; font-size: 11px; line-height: 1.6; margin: 13px 0 0; }
    .status {
      padding: 10px 11px;
      margin: 15px 0 20px;
      border-radius: 8px;
      background: #edf2e9;
      color: #48694b;
      font-size: 12px;
      line-height: 1.6;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .status.error { background: #fbe5df; color: #9d3129; }
    .history {
      border-top: 8px solid #f4ecdf;
      padding: 19px 0 0;
    }
    .history-header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .section-label { margin: 0 0 13px; color: var(--ink); font-size: 16px; font-weight: 850; }
    .section-desc { margin: -5px 0 15px; font-size: 11px; color: #938475; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border: 1px solid #ede2d3;
      border-radius: 11px;
      background: #fff;
      padding: 13px 3px;
      gap: 3px;
      margin-bottom: 16px;
    }
    .stat { text-align: center; border-right: 1px solid #eee6d9; }
    .stat:last-child { border-right: none; }
    .stat-value { display: block; font-size: 22px; font-weight: 850; color: #a8642e; font-variant-numeric: tabular-nums; }
    .stat-label { display: block; margin-top: 3px; font-size: 10px; color: #817263; }
    .filters { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 9px; }
    .filters input, .filters select {
      min-width: 0;
      min-height: 42px;
      border: 1px solid #ddd2c3;
      border-radius: 9px;
      padding: 9px 11px;
      color: var(--ink);
      background: #fff;
      font-size: 14px;
    }
    .filters select { padding: 8px; font-size: 12px; }
    .filter-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 11px 0 10px; }
    .filter-row label { display: inline-flex; gap: 7px; align-items: center; color: #866445; font-size: 12px; font-weight: 750; }
    .filter-row input { margin: 0; width: 17px; height: 17px; accent-color: var(--orange-deep); }
    .result-count { color: #948578; font-size: 11px; font-variant-numeric: tabular-nums; }
    .records { display: grid; gap: 10px; }
    .record { border: 1px solid #e8ddcf; border-radius: 10px; background: #fff; overflow: hidden; }
    .record-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 12px 13px 9px; }
    .shop-title { margin: 0; color: #4d4239; font-size: 15px; font-weight: 850; overflow-wrap: anywhere; }
    .shop-area { margin: 5px 0 0; color: #867768; font-size: 12px; overflow-wrap: anywhere; }
    .date-chip { flex: 0 0 auto; color: #8b795f; background: #f8f1e7; border-radius: 6px; padding: 5px 7px; font-size: 11px; font-variant-numeric: tabular-nums; }
    .record-body { padding: 0 13px 12px; }
    .dish-name { margin: 0 0 10px; font-size: 15px; font-weight: 800; overflow-wrap: anywhere; }
    .detail-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .chip { padding: 5px 8px; border-radius: 6px; background: #f5f2ed; color: #786b5b; font-size: 11px; font-weight: 750; }
    .chip.star { color: #b27835; background: #fff4df; }
    .chip.want { color: #b7683c; background: #fff0e8; }
    .memo { margin: 10px 0 0; color: #6f6258; font-size: 12px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
    .card-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #f1e9de; }
    .card-actions button {
      min-width: 0;
      min-height: 43px;
      padding: 9px 3px;
      border: none;
      border-right: 1px solid #f1e9de;
      background: #fffdf9;
      color: #7b6a5c;
      font-size: 12px;
      font-weight: 750;
    }
    .card-actions button:last-child { border-right: none; color: #a5453d; }
    .card-actions button.active { color: #be6e3f; background: #fff5e9; }
    .empty { padding: 16px 0 22px; color: #8b7b6b; text-align: center; font-size: 12px; line-height: 1.7; }
    footer { padding: 23px 18px; color: #998977; text-align: center; font-size: 11px; line-height: 1.6; }
    @media (max-width: 350px) {
      .topbar-inner { padding-left: 10px; padding-right: 10px; }
      main { padding: 0 11px; }
      .field-grid { gap: 11px 8px; }
      .field select { font-size: 12px; }
      .filters { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <span class="topbar-mark" aria-hidden="true">🥟</span>
        <h1 id="form-title">記録する</h1>
        <button id="save-record" class="save-button" type="submit" form="record-form" disabled>保存</button>
      </div>
    </header>
    <main>
      <p class="intro">町中華メモ　／　お気に入りの一皿を残そう</p>
      <form id="record-form">
        <section id="required-fields" class="input-group" aria-labelledby="required-fields-title">
          <h3 id="required-fields-title" class="input-group-title"><span class="group-kind required">必須</span> 基本情報</h3>
          <p class="group-hint">この3項目で記録できます。</p>
          <div class="field-grid">
            <label class="field full">食べた料理
              <input id="dish" type="text" maxlength="50" placeholder="例：麻婆豆腐" autocomplete="off" required disabled>
            </label>
            <label class="field full">お店の名前
              <input id="shop" type="text" maxlength="40" placeholder="例：駅前の大衆中華" autocomplete="off" required disabled>
            </label>
            <label class="field full">行った日
              <input id="visited-at" type="date" min="2000-01-01" max="2099-12-31" required disabled>
            </label>
          </div>
        </section>
        <section id="optional-fields" class="input-group optional" aria-labelledby="optional-fields-title">
          <h3 id="optional-fields-title" class="input-group-title"><span class="group-kind optional">任意</span> オプション項目</h3>
          <p class="group-hint">空欄でもOK。満足度は変更しなければ「ふつう」になります。</p>
          <div class="field-grid">
            <label class="field">お会計（税込・円）
              <input id="price" type="number" inputmode="numeric" min="1" max="100000" step="1" placeholder="例：850" disabled>
            </label>
            <label class="field">満足度
              <select id="rating" disabled>
                <option value="5">★★★★★ 最高</option>
                <option value="4">★★★★☆ おいしい</option>
                <option value="3" selected>★★★☆☆ ふつう</option>
                <option value="2">★★☆☆☆ もう少し</option>
                <option value="1">★☆☆☆☆ 好みと違う</option>
              </select>
            </label>
            <label class="field full">場所・最寄り駅
              <input id="area" type="text" maxlength="50" placeholder="例：高円寺" disabled>
            </label>
            <label class="field full">ひとことメモ
              <textarea id="note" maxlength="140" placeholder="料理の感想や、お店の雰囲気など" disabled></textarea>
            </label>
          </div>
          <label class="favorite-check"><input id="favorite" type="checkbox" disabled>♡ また行きたいお店</label>
        </section>
        <div class="buttons">
          <button type="button" id="cancel-edit" class="secondary hidden" disabled>編集をやめる</button>
        </div>
      </form>
      <p class="helper">記録は本人専用です。保存ボタンから追加・更新できます。</p>
      <p id="status" class="status" role="status" aria-live="polite">個人の記録を読み込み中…</p>
      <section class="history" aria-labelledby="history-title">
        <div class="history-header"><h2 id="history-title" class="section-label">食べ歩きノート</h2></div>
        <p class="section-desc">記録の検索、編集、削除はこちらから。</p>
        <div class="stats" aria-label="記録のまとめ">
          <div class="stat"><strong id="stat-visits" class="stat-value">—</strong><span class="stat-label">食べた記録</span></div>
          <div class="stat"><strong id="stat-shops" class="stat-value">—</strong><span class="stat-label">訪れたお店</span></div>
          <div class="stat"><strong id="stat-favorites" class="stat-value">—</strong><span class="stat-label">また行きたい</span></div>
        </div>
        <div class="filters">
          <input id="search" type="search" placeholder="店名・場所・料理で探す" aria-label="記録を検索" disabled>
          <select id="sort" aria-label="並び順" disabled>
            <option value="recent">新しい順</option>
            <option value="rating">評価が高い順</option>
          </select>
        </div>
        <div class="filter-row">
          <label><input id="favorites-only" type="checkbox" disabled>♡ また行きたいだけ</label>
          <span id="result-count" class="result-count"></span>
        </div>
        <div id="records" class="records" aria-live="polite"></div>
        <p id="no-records" class="empty">まだ記録がありません。最初の一皿を書いてみよう。</p>
      </section>
    </main>
    <footer>みんアプ工房の個人用保存APIに保存します。</footer>
  </div>
  <script src="memo.js"></script>
  <script src="app.js"></script>
</body>
</html>
