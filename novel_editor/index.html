<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ノベルゲームメーカー</title>
  <style>
    :root {
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
      color: #49384f;
      background: #fff9fc;
      --ink: #57424f;
      --muted: #8c7893;
      --pink: #f8dbe8;
      --pink-strong: #ef6fa6;
      --lavender: #76558f;
      --lavender-soft: #eee5f7;
      --border: #eaddea;
      --card: rgba(255,255,255,.9);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid #c6a9dd;
      outline-offset: 2px;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(180deg, #fff9fc 0%, #fbf4ff 60%, #f4effb 100%);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-title { min-width: 0; }
    .header-title h1 { margin: 0; font-size: 18px; color: var(--ink); }
    .header-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 27px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #f2e9f7;
      color: #685775;
      font-size: 11px;
      font-weight: 800;
    }
    #status[data-kind="error"] { background: #ffe5e8; color: #922a3d; }
    #status[data-kind="ok"] { background: #e2f6e9; color: #2c6941; }
    #status[data-kind="dirty"] { background: #fff0c9; color: #755108; }
    #status[data-kind="waiting"] { background: #e9efff; color: #3f5489; }
    .technical-meta { display: none; }

    .actions { display: flex; align-items: center; gap: 7px; }
    .primary, .secondary, .ghost-button {
      min-height: 42px;
      border-radius: 13px;
      padding: 9px 13px;
      font-weight: 900;
      border: 0;
    }
    .primary { background: var(--pink-strong); color: white; }
    .secondary { background: var(--lavender-soft); color: #563d69; }
    .ghost-button { background: white; color: var(--lavender); border: 1px solid var(--border); }
    button:disabled { opacity: .42; cursor: not-allowed; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(250px, 320px) minmax(380px, 1fr) minmax(280px, 340px);
      min-height: 0;
    }
    .pane {
      min-width: 0;
      padding: 18px;
      overflow: auto;
      border-right: 1px solid var(--border);
    }
    .pane:last-child { border-right: 0; }
    .pane-title { margin: 0 0 14px; font-size: 19px; color: var(--ink); }
    .pane-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .pane-heading h2 { margin: 0; font-size: 19px; }

    label {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 900;
      color: var(--ink);
    }
    input, select, textarea {
      width: 100%;
      min-height: 42px;
      border: 1px solid #d9cadd;
      border-radius: 12px;
      background: white;
      color: inherit;
      padding: 10px 11px;
    }
    textarea { resize: vertical; line-height: 1.65; min-height: 110px; }

    .title-field input { font-size: 16px; font-weight: 900; }
    .settings-launch { width: 100%; margin: 4px 0 18px; }

    #scene-list { display: grid; gap: 10px; }
    .scene-row {
      display: grid !important;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 7px !important;
      align-items: center !important;
      margin: 0 !important;
    }
    .scene-button {
      width: 100%;
      min-height: 58px;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 12px 13px;
      background: var(--card);
      color: var(--ink);
      text-align: left;
      font-size: 15px;
      font-weight: 900;
      box-shadow: 0 5px 18px rgba(118,85,143,.05);
    }
    .scene-button[data-selected="true"] {
      border-color: #b995cf;
      background: #f4ebfa;
    }
    .scene-row > .danger { opacity: .75; }
    .simple-scene-add { margin-top: 2px !important; }
    .simple-scene-add .technical-control { display: none !important; }
    .simple-scene-add > button { width: 100%; min-height: 46px; }

    .scene-heading, .event-heading, .readonly-row, .choice-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .scene-heading { margin-bottom: 14px; }
    .scene-heading h2 { margin: 0; font-size: 19px; }
    .technical-control, .technical-id { display: none !important; }

    .event-card {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 6px 20px rgba(118,85,143,.055);
    }
    .event-card[data-event-type="dialogue"] { border-left: 4px solid #a889cf; }
    .event-card[data-event-type="choice"] { border-left: 4px solid #e983ad; }
    .event-card[data-event-type="background"] { border-left: 4px solid #83c9bd; }
    .event-card[data-event-type="character"] { border-left: 4px solid #9eb4e3; }
    .event-card[data-event-type="bgm"], .event-card[data-event-type="se"] { border-left: 4px solid #c59bd8; }
    .event-card[data-event-type="goto"], .event-card[data-event-type="end"] { border-left: 4px solid #efb779; }
    .event-heading strong { font-size: 14px; }
    .choice-row { align-items: flex-start; }
    .choice-row input { flex: 1; }

    .asset-form { display: grid; gap: 8px; margin: 10px 0 12px; }
    .asset-form label { margin: 0; }
    .asset-row {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
    }
    .asset-row > div:first-child { display: grid; gap: 4px; min-width: 0; }
    .asset-row.orphan { border-style: dashed; background: #fffaf0; }
    .asset-actions { display: flex; flex-wrap: wrap; gap: 6px; }

    .settings-category-home {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }
    .settings-category-home h3 { margin: 0; font-size: 16px; }
    .settings-category-home p { margin: 0; color: #756582; font-size: 12px; line-height: 1.6; }
    .settings-category-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    .settings-category-button {
      min-height: 72px;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,.92);
      color: var(--ink);
      text-align: left;
      font-weight: 900;
    }
    .settings-category-button .category-icon { font-size: 24px; text-align: center; }
    .settings-category-button .category-arrow { color: #9e8ca8; font-size: 20px; }
    .settings-category-button:last-child:nth-child(odd) { grid-column: 1 / -1; }

    .settings-subnav {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
    }
    .settings-subnav[hidden] { display: none !important; }
    .settings-subnav button {
      min-height: 38px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,.9);
      color: #6a5574;
      font-weight: 900;
    }
    .settings-subnav strong { font-size: 16px; }

    .character-card {
      padding: 0;
      overflow: hidden;
    }
    .character-summary {
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px;
    }
    .character-summary-copy {
      display: grid;
      gap: 3px;
      min-width: 0;
    }
    .character-summary-copy strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
    }
    .character-open {
      min-height: 38px;
      white-space: nowrap;
    }
    .character-detail {
      display: grid;
      gap: 12px;
      padding: 0 10px 12px;
      border-top: 1px solid #f0e6f1;
    }
    .character-detail > label:first-child { margin-top: 12px; }
    .character-expression-card {
      display: grid;
      grid-template-columns: minmax(110px, .8fr) minmax(0, 1.2fr);
      gap: 10px;
      padding: 10px;
      border: 1px solid #eee2ef;
      border-radius: 14px;
      background: #fffafd;
    }
    .character-expression-controls {
      display: grid;
      align-content: start;
      gap: 8px;
      min-width: 0;
    }
    .character-expression-name { font-size: 13px; }
    .character-delete { width: 100%; margin-top: 4px; }
    .character-create-form {
      padding: 12px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,.78);
    }
    .character-expression-create {
      padding-top: 10px;
      border-top: 1px dashed #eaddea;
    }

    body[data-settings-section="characters"] .character-card .character-detail {
      display: none;
    }
    body[data-settings-section="character-detail"] #character-list > .character-card:not([data-settings-active="true"]),
    body[data-settings-section="character-detail"] #character-list > .character-create-form {
      display: none !important;
    }
    body[data-settings-section="character-detail"] .character-open {
      display: none !important;
    }
    .mini-button {
      border: 0;
      border-radius: 9px;
      padding: 7px 9px;
      background: var(--lavender-soft);
      color: #563d69;
      font-size: 12px;
      font-weight: 800;
    }
    .mini-button.danger { background: #ffe6e9; color: #942d42; }

    .editor-confirm-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(52, 38, 57, .48);
      backdrop-filter: blur(5px);
    }
    .editor-confirm-dialog {
      width: min(360px, 100%);
      display: grid;
      gap: 14px;
      padding: 20px;
      border: 1px solid #ead8ea;
      border-radius: 22px;
      background: #fffafc;
      box-shadow: 0 24px 70px rgba(47, 28, 56, .24);
    }
    .editor-confirm-dialog h2 {
      margin: 0;
      color: #5e4865;
      font-size: 18px;
    }
    .editor-confirm-dialog p {
      margin: 0;
      color: #5f505f;
      font-size: 14px;
      line-height: 1.7;
    }
    .editor-confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }
    .editor-confirm-actions button {
      min-height: 44px;
      border-radius: 13px;
      font-weight: 900;
    }
    .editor-confirm-actions .danger {
      border: 0;
      background: #f4a7b8;
      color: #6e2637;
    }

    .event-menu { position: relative; }
    .event-menu > summary {
      list-style: none;
      cursor: pointer;
      min-width: 36px;
      min-height: 36px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #f4edf8;
      font-size: 20px;
      font-weight: 900;
    }
    .event-menu > summary::-webkit-details-marker { display: none; }
    .event-menu[open] > .asset-actions {
      position: absolute;
      right: 0;
      top: 42px;
      z-index: 12;
      width: 160px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      box-shadow: 0 12px 30px rgba(70,45,85,.16);
      display: grid;
    }
    .event-menu[open] > .asset-actions button { width: 100%; }

    .event-add-card {
      background: transparent;
      border-style: dashed;
      box-shadow: none;
      padding: 0;
      border: 0;
    }
    .simple-add-controls { display: grid; gap: 8px; }
    .simple-add-button { width: 100%; min-height: 48px; text-align: left; padding-inline: 16px; }

    .side-card, .settings-card {
      margin-bottom: 14px;
      padding: 14px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--border);
    }
    .side-card h3, .settings-card h3 { margin: 0; font-size: 15px; }
    .side-card p, .settings-card p { margin: 8px 0 0; font-size: 12px; line-height: 1.6; color: #756582; }
    #asset-list { display: grid; gap: 8px; }
    #asset-list code { overflow-wrap: anywhere; color: #786683; font-size: 10px; }
    #asset-preview { display: grid; gap: 7px; margin-top: 10px; }
    #asset-preview img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 10px; background: #f3eef7; }
    #asset-preview audio { width: 100%; }
    .inline-image-preview {
      display: grid;
      gap: 5px;
      min-width: 0;
    }
    .inline-image-preview-frame {
      overflow: hidden;
      border: 1px solid #eaddea;
      border-radius: 14px;
      background:
        linear-gradient(45deg, rgba(239,229,244,.58) 25%, transparent 25%, transparent 75%, rgba(239,229,244,.58) 75%),
        linear-gradient(45deg, rgba(239,229,244,.58) 25%, #fff 25%, #fff 75%, rgba(239,229,244,.58) 75%);
      background-position: 0 0, 8px 8px;
      background-size: 16px 16px;
    }
    .inline-image-preview[data-variant="background"] .inline-image-preview-frame { aspect-ratio: 16 / 9; }
    .inline-image-preview[data-variant="character"] .inline-image-preview-frame {
      height: clamp(150px, 42vw, 220px);
    }
    .inline-image-preview[data-variant="character-thumb"] .inline-image-preview-frame {
      width: 68px;
      height: 68px;
      border-radius: 12px;
    }
    .inline-image-preview img {
      display: block;
      width: 100%;
      height: 100%;
    }
    .inline-image-preview[data-variant="background"] img { object-fit: cover; }
    .inline-image-preview[data-variant="character"] img,
    .inline-image-preview[data-variant="character-thumb"] img {
      object-fit: contain;
      object-position: center bottom;
    }
    .inline-image-preview-status {
      min-height: 16px;
      color: #806e88;
      font-size: 10px;
      line-height: 1.4;
    }
    .inline-image-preview[data-state="ready"] .inline-image-preview-status { display: none; }
    .inline-image-preview[data-state="error"] .inline-image-preview-status { color: #9a2d2d; }
    .inline-check { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 12px; }
    .inline-check input { width: auto; }
    #validation[data-kind="ok"] { color: #24663c; }
    #validation[data-kind="error"] { color: #9a2d2d; }
    details.advanced-details { margin-top: 12px; }
    details.advanced-details > summary { cursor: pointer; font-weight: 900; color: #6a5574; }

    .mobile-only { display: none; }

    .effects-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 14px;
      background: rgba(55,43,58,.42);
    }
    .effects-overlay[hidden] { display: none; }
    .effects-sheet {
      width: min(560px, 100%);
      max-height: min(80vh, 720px);
      overflow: auto;
      padding: 18px;
      border-radius: 24px 24px 18px 18px;
      background: #fffdfd;
      box-shadow: 0 20px 60px rgba(49,35,57,.24);
    }
    .effects-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .effects-heading h2 { margin: 0; font-size: 20px; }
    .sheet-close { border: 0; background: #f4edf8; border-radius: 999px; width: 38px; height: 38px; font-size: 24px; }
    .effects-list { display: grid; gap: 9px; }
    .effects-option {
      display: grid;
      grid-template-columns: 44px minmax(0,1fr) auto;
      align-items: center;
      gap: 11px;
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #fff9fd;
      color: var(--ink);
      text-align: left;
    }
    .effects-option strong { display: block; font-size: 14px; }
    .effects-option small { display: block; margin-top: 3px; color: var(--muted); line-height: 1.4; }
    .effects-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; background: #eee5f7; font-size: 21px; }
    .sheet-cancel { width: 100%; margin-top: 12px; }

    @media (max-width: 900px) {
      header { padding: 10px 12px; }
      .header-title h1 { font-size: 16px; }
      .actions { gap: 5px; }
      .actions button { min-height: 38px; padding: 7px 9px; font-size: 12px; }
      .workspace { display: block; }
      .pane { border-right: 0; min-height: calc(100dvh - 86px); }
      .mobile-only { display: inline-flex; }
      body[data-simple-view="scenes"] .editor-pane,
      body[data-simple-view="scenes"] .settings-pane { display: none; }
      body[data-simple-view="editor"] .scene-pane,
      body[data-simple-view="editor"] .settings-pane { display: none; }
      body[data-simple-view="settings"] .scene-pane,
      body[data-simple-view="settings"] .editor-pane { display: none; }
      .scene-pane, .editor-pane, .settings-pane { padding: 14px; }
      .settings-category-grid { grid-template-columns: 1fr; }
      .settings-category-button:last-child:nth-child(odd) { grid-column: auto; }
      .character-expression-card { grid-template-columns: 1fr; }
      .character-expression-card .inline-image-preview[data-variant="character"] .inline-image-preview-frame {
        height: clamp(180px, 58vw, 280px);
      }
      .scene-row > .danger {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 52px;
        min-height: 58px;
        padding: 8px 9px;
        border-radius: 14px;
        opacity: 1;
      }
      .scene-row > .danger:disabled {
        opacity: .35;
        cursor: not-allowed;
      }

      .editor-footer .footer-icon {
        display: block;
        width: 32px;
        height: 32px;
        font-size: 0 !important;
        line-height: 0 !important;
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain;
      }
      .editor-footer button[data-editor-view="scenes"] .footer-icon { background-image: url("assets/footer-project.png"); }
      .editor-footer button[data-editor-view="editor"] .footer-icon { background-image: url("assets/footer-scene.png"); }
      .editor-footer button[data-editor-view="settings"] .footer-icon { background-image: url("assets/footer-settings.png"); }
      .editor-footer button[data-editor-view="publish"] .footer-icon { background-image: url("assets/footer-publish.png"); }
      .editor-footer button[data-selected="true"] .footer-icon { transform: scale(1.06); }
    }

    @media (max-width: 520px) {
      #save-button { font-size: 0; width: 40px; padding: 0; }
      #save-button::before { content: '✓'; font-size: 17px; }
      .header-meta { max-width: 170px; }
      #status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
      .choice-row { display: grid; }
      .effects-overlay { padding: 0; }
      .effects-sheet { border-radius: 24px 24px 0 0; }
    }
  </style>
</head>
<body data-simple-view="scenes">
  <main class="app">
    <header>
      <div class="header-title">
        <h1>📖 ノベルゲームを作る</h1>
        <div class="header-meta">
          <span id="revision" class="pill technical-meta">Draft -</span>
          <span id="content-revision" class="pill technical-meta">Save compatibility -</span>
          <span id="status" class="pill" data-kind="waiting">作品を読み込んでいます</span>
        </div>
      </div>
      <div class="actions">
        <button id="save-button" class="secondary" type="button" disabled>保存</button>
        <button id="preview-button" class="ghost-button" type="button" disabled>▷ ためし読み</button>
        <button id="publish-button" class="primary" type="button" disabled>公開する</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="pane scene-pane">
        <h2 class="pane-title">作品編集</h2>
        <label class="title-field">
          作品タイトル
          <input id="story-title" type="text" maxlength="100" disabled>
        </label>
        <h2 class="pane-title">シーン一覧</h2>
        <div id="scene-list"></div>
        <button id="open-project-settings" class="ghost-button settings-launch" type="button">⚙ 作品設定・素材</button>
      </aside>

      <section class="pane editor-pane">
        <div class="pane-heading mobile-only">
          <button id="scene-back" class="ghost-button" type="button">← シーン一覧</button>
        </div>
        <div id="event-editor">
          <p>作品を読み込んでいます。</p>
        </div>
      </section>

      <aside id="settings-pane" class="pane settings-pane">
        <div class="pane-heading">
          <h2>設定</h2>
          <button id="close-project-settings" class="ghost-button mobile-only" type="button">閉じる</button>
        </div>

        <section id="project-settings-card" class="settings-card">
          <h3>最初のシーン</h3>
          <p>通常はシーン1のままで大丈夫です。</p>
          <label>
            最初に表示するシーン
            <select id="start-scene" disabled></select>
          </label>
        </section>

        <div id="character-settings-slot"></div>

        <section id="asset-settings-card" class="side-card">
          <h3>画像・音楽</h3>
          <p>背景、立ち絵、BGM、効果音に使う素材を追加できます。</p>
          <div class="asset-form">
            <label>
              素材の名前
              <input id="asset-id" type="text" maxlength="64" placeholder="例: classroom / akari_smile / bgm01" disabled>
            </label>
            <label>
              画像・音楽ファイル
              <input id="asset-file" type="file" accept=".png,.jpg,.jpeg,.gif,.webp,.mp3,.m4a,.ogg,.wav,image/png,image/jpeg,image/gif,image/webp,audio/mpeg,audio/mp4,audio/ogg,audio/wav" disabled>
            </label>
            <button id="asset-save-button" class="secondary" type="button" disabled>追加 / 差し替え</button>
          </div>
          <div id="asset-list"><p>素材はまだありません。</p></div>
          <div id="asset-preview"></div>
        </section>

        <details class="advanced-details side-card">
          <summary>詳細・問題の確認</summary>
          <p id="validation">未読込</p>
          <p>エラーが出た場合は、ここに元の診断情報を表示します。自動で別形式へ変換したり、別経路へ切り替えたりはしません。</p>
        </details>
      </aside>
    </div>
  </main>

  <script src="story-validator.js"></script>
  <script src="editor-core.js"></script>
  <script src="asset-tools.js"></script>
  <script src="editor-resilience.js"></script>
  <script src="editor.js"></script>
  <script src="simple-ui.js"></script>
</body>
</html>
