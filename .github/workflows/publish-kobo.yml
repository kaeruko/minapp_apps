name: Publish Kobo apps

on:
  push:
    branches: [main]
    paths:
      - 'drink_budget/**'
      - 'chinese_food_memo/**'
      - 'deploy/kobo/**'
      - '.github/workflows/publish-kobo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kobo-publish-main
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        include:
          - app: drink_budget
            test: test_budget.js
            core: budget.js
          - app: chinese_food_memo
            test: test_memo.js
            core: memo.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ${{ matrix.app }} and deploy contract
        run: |
          node --check "${{ matrix.app }}/app.js"
          node --check "${{ matrix.app }}/${{ matrix.core }}"
          node "${{ matrix.app }}/${{ matrix.test }}"
          python -m unittest discover -s deploy/kobo -p 'test_*.py' -v
          python deploy/kobo/publish.py --app "${{ matrix.app }}" --check
      - name: Test required and optional form fields
        if: matrix.app == 'chinese_food_memo'
        run: python -m unittest discover -s chinese_food_memo -p 'test_*.py' -v
      - name: Publish ${{ matrix.app }} to みんアプ工房
        env:
          KOBO_API_BASE_URL: ${{ secrets.KOBO_API_BASE_URL }}
          KOBO_LOGIN_ID: ${{ secrets.KOBO_LOGIN_ID }}
          KOBO_PASSWORD: ${{ secrets.KOBO_PASSWORD }}
          KOBO_GROUP_ID: ${{ secrets.KOBO_GROUP_ID }}
        run: python deploy/kobo/publish.py --app "${{ matrix.app }}" --publish
