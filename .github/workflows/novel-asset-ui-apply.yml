name: Apply Novel Authoring asset UI

on:
  push:
    branches:
      - chatgpt/novel-v1-player-foundation
    paths:
      - '.github/workflows/novel-asset-ui-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/novel-v1-player-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply asset UI
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          asset_tools = r'''(function (root, factory) {
            'use strict';
            const api = factory();
            if (typeof module === 'object' && module.exports) {
              module.exports = api;
            } else {
              root.MinAppNovelAssetTools = api;
            }
          })(typeof globalThis !== 'undefined' ? globalThis : this, function () {
            'use strict';

            const ID_RE = /^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/;
            const TYPES = Object.freeze({
              '.png': Object.freeze({ mime: 'image/png', kind: 'image' }),
              '.jpg': Object.freeze({ mime: 'image/jpeg', kind: 'image' }),
              '.jpeg': Object.freeze({ mime: 'image/jpeg', kind: 'image' }),
              '.gif': Object.freeze({ mime: 'image/gif', kind: 'image' }),
              '.webp': Object.freeze({ mime: 'image/webp', kind: 'image' }),
              '.mp3': Object.freeze({ mime: 'audio/mpeg', kind: 'audio' }),
              '.m4a': Object.freeze({ mime: 'audio/mp4', kind: 'audio' }),
              '.ogg': Object.freeze({ mime: 'audio/ogg', kind: 'audio' }),
              '.wav': Object.freeze({ mime: 'audio/wav', kind: 'audio' }),
            });

            class NovelAssetError extends Error {
              constructor(code, message) {
                super(message);
                this.name = 'NovelAssetError';
                this.code = code;
              }
            }

            function fail(code, message) {
              throw new NovelAssetError(code, message);
            }

            function requireAssetId(value) {
              if (typeof value !== 'string' || !ID_RE.test(value)) {
                fail('invalid_asset_id', '素材IDは英数字で始まる64文字以内のIDにしてください');
              }
              return value;
            }

            function fileSpec(fileName, browserMime) {
              if (typeof fileName !== 'string' || fileName.length === 0) {
                fail('invalid_asset_file', '素材ファイル名が不正です');
              }
              const base = fileName.split(/[\\/]/).pop();
              const dot = base.lastIndexOf('.');
              const extension = dot < 0 ? '' : base.slice(dot).toLowerCase();
              const spec = TYPES[extension];
              if (!spec) {
                fail('unsupported_asset_type', `未対応の素材形式です: ${extension || '(拡張子なし)'}`);
              }
              if (browserMime && browserMime !== spec.mime) {
                fail('asset_mime_mismatch', `ファイルのMIME ${browserMime} と拡張子 ${extension} が一致しません`);
              }
              return Object.freeze({ extension, mime: spec.mime, kind: spec.kind });
            }

            function descriptor(assetId, fileName, browserMime, previous) {
              const id = requireAssetId(assetId);
              const spec = fileSpec(fileName, browserMime);
              const result = {
                kind: spec.kind,
                src: `assets/${id}${spec.extension}`,
                mime: spec.mime,
              };
              if (spec.kind === 'image' && previous && typeof previous.alt === 'string') {
                result.alt = previous.alt;
              }
              return result;
            }

            function references(story, assetId) {
              requireAssetId(assetId);
              const result = [];
              if (!story || typeof story !== 'object') return result;
              const characters = story.characters && typeof story.characters === 'object' ? story.characters : {};
              for (const [characterId, character] of Object.entries(characters)) {
                const expressions = character && typeof character.expressions === 'object' ? character.expressions : {};
                for (const [expressionId, value] of Object.entries(expressions)) {
                  if (value === assetId) result.push(`character:${characterId}.${expressionId}`);
                }
              }
              const scenes = story.scenes && typeof story.scenes === 'object' ? story.scenes : {};
              for (const [sceneId, scene] of Object.entries(scenes)) {
                const events = scene && Array.isArray(scene.events) ? scene.events : [];
                for (const event of events) {
                  if (!event || typeof event !== 'object') continue;
                  if ((event.type === 'background' || event.type === 'se') && event.asset === assetId) {
                    result.push(`scene:${sceneId}/${event.id}`);
                  }
                  if (event.type === 'bgm' && event.action === 'play' && event.asset === assetId) {
                    result.push(`scene:${sceneId}/${event.id}`);
                  }
                }
              }
              return result;
            }

            function pathUsedByOtherDescriptor(story, excludedAssetId, path) {
              if (!story || !story.assets || typeof story.assets !== 'object') return false;
              return Object.entries(story.assets).some(([assetId, asset]) =>
                assetId !== excludedAssetId && asset && asset.src === path
              );
            }

            function serverAssetByPath(serverAssets, path) {
              if (!Array.isArray(serverAssets)) return null;
              return serverAssets.find((asset) => asset && asset.path === path) || null;
            }

            return {
              NovelAssetError,
              requireAssetId,
              fileSpec,
              descriptor,
              references,
              pathUsedByOtherDescriptor,
              serverAssetByPath,
            };
          });
          '''
          Path('novel_editor/asset-tools.js').write_text(asset_tools)

          test_asset_tools = r'''\'use strict\';

          const assert = require('assert');
          const tools = require('./asset-tools.js');

          {
            const value = tools.descriptor('classroom', 'bg.PNG', 'image/png');
            assert.deepStrictEqual(value, {
              kind: 'image',
              src: 'assets/classroom.png',
              mime: 'image/png',
            });
          }

          {
            const value = tools.descriptor('theme', 'music.m4a', 'audio/mp4');
            assert.deepStrictEqual(value, {
              kind: 'audio',
              src: 'assets/theme.m4a',
              mime: 'audio/mp4',
            });
          }

          assert.throws(
            () => tools.descriptor('../bad', 'x.png', 'image/png'),
            (error) => error && error.code === 'invalid_asset_id',
          );
          assert.throws(
            () => tools.descriptor('hero', 'x.exe', ''),
            (error) => error && error.code === 'unsupported_asset_type',
          );
          assert.throws(
            () => tools.descriptor('hero', 'x.png', 'audio/mpeg'),
            (error) => error && error.code === 'asset_mime_mismatch',
          );

          {
            const story = {
              assets: {},
              characters: {
                akari: { expressions: { smile: 'akari_smile' } },
              },
              scenes: {
                start: {
                  events: [
                    { id: 'bg', type: 'background', asset: 'classroom' },
                    { id: 'music', type: 'bgm', action: 'play', asset: 'theme' },
                    { id: 'se', type: 'se', asset: 'bell' },
                  ],
                },
              },
            };
            assert.deepStrictEqual(tools.references(story, 'akari_smile'), ['character:akari.smile']);
            assert.deepStrictEqual(tools.references(story, 'classroom'), ['scene:start/bg']);
            assert.deepStrictEqual(tools.references(story, 'theme'), ['scene:start/music']);
            assert.deepStrictEqual(tools.references(story, 'bell'), ['scene:start/se']);
          }

          {
            const story = {
              assets: {
                one: { src: 'assets/shared.png' },
                two: { src: 'assets/shared.png' },
              },
            };
            assert.strictEqual(
              tools.pathUsedByOtherDescriptor(story, 'one', 'assets/shared.png'),
              true,
            );
            assert.strictEqual(
              tools.pathUsedByOtherDescriptor(story, 'one', 'assets/other.png'),
              false,
            );
          }

          console.log('Novel asset tool tests passed.');
          '''
          Path('novel_editor/test_asset_tools.js').write_text(test_asset_tools)

          # Tighten generic Authoring project asset metadata validation in the Novel contract layer.
          core_path = 'novel_editor/editor-core.js'
          replace_once(
              core_path,
              "  const PUBLISH_RESPONSE_FIELDS = new Set([\n",
              "  const PROJECT_ASSET_FIELDS = new Set(['path', 'sha256', 'bytes', 'content_type', 'revision']);\n  const SHA256_RE = /^[0-9a-f]{64}$/;\n  const PUBLISH_RESPONSE_FIELDS = new Set([\n",
          )
          replace_once(
              core_path,
              "  function requireFormat(value) {\n",
              "  function validateProjectAssets(value) {\n    if (!Array.isArray(value)) {\n      fail('invalid_authoring_response', 'assets must be a list');\n    }\n    for (const asset of value) {\n      requireExactFields(asset, PROJECT_ASSET_FIELDS, 'Authoring asset metadata');\n      requireString(asset.path, 'asset.path');\n      requireString(asset.sha256, 'asset.sha256');\n      if (!SHA256_RE.test(asset.sha256)) {\n        fail('invalid_authoring_response', 'asset.sha256 must be lowercase SHA-256');\n      }\n      requirePositiveInteger(asset.bytes, 'asset.bytes');\n      requireString(asset.content_type, 'asset.content_type');\n      requirePositiveInteger(asset.revision, 'asset.revision');\n    }\n    return value;\n  }\n\n  function requireFormat(value) {\n",
          )
          replace_once(
              core_path,
              "    if (!Array.isArray(payload.assets)) {\n      fail('invalid_authoring_response', 'assets must be a list');\n    }\n    requireString(payload.created_at, 'created_at');\n",
              "    validateProjectAssets(payload.assets);\n    requireString(payload.created_at, 'created_at');\n",
          )
          # There are two later Array.isArray(payload.assets) checks: save and publish.
          p = Path(core_path)
          text = p.read_text()
          old = "    if (!Array.isArray(payload.assets)) {\n      fail('invalid_authoring_response', 'assets must be a list');\n    }\n"
          if text.count(old) != 2:
              raise RuntimeError(f'{core_path}: expected two remaining asset-list checks, found {text.count(old)}')
          p.write_text(text.replace(old, "    validateProjectAssets(payload.assets);\n"))

          editor_path = 'novel_editor/editor.js'
          replace_once(
              editor_path,
              "  const core = window.MinAppNovelEditorCore;\n",
              "  const core = window.MinAppNovelEditorCore;\n  const assetTools = window.MinAppNovelAssetTools;\n",
          )
          replace_once(
              editor_path,
              "  if (!core || typeof core.validateProject !== 'function') {\n    throw new Error('MinAppNovelEditorCore is not loaded');\n  }\n",
              "  if (!core || typeof core.validateProject !== 'function') {\n    throw new Error('MinAppNovelEditorCore is not loaded');\n  }\n  if (!assetTools || typeof assetTools.descriptor !== 'function') {\n    throw new Error('MinAppNovelAssetTools is not loaded');\n  }\n",
          )
          replace_once(
              editor_path,
              "    assetList: document.getElementById('asset-list'),\n",
              "    assetId: document.getElementById('asset-id'),\n    assetFile: document.getElementById('asset-file'),\n    assetSave: document.getElementById('asset-save-button'),\n    assetList: document.getElementById('asset-list'),\n    assetPreview: document.getElementById('asset-preview'),\n",
          )
          replace_once(
              editor_path,
              "  let busy = false;\n",
              "  let busy = false;\n  let assetPreviewUrl = null;\n",
          )
          replace_once(
              editor_path,
              "      typeof api.load !== 'function' ||\n      typeof api.save !== 'function' ||\n      typeof api.preview !== 'function' ||\n      typeof api.publish !== 'function'\n    ) {\n      throw Object.assign(new Error('minapp.authoring.load/save/preview/publish are required'), {\n",
              "      typeof api.load !== 'function' ||\n      typeof api.save !== 'function' ||\n      typeof api.getAsset !== 'function' ||\n      typeof api.saveAsset !== 'function' ||\n      typeof api.deleteAsset !== 'function' ||\n      typeof api.preview !== 'function' ||\n      typeof api.publish !== 'function'\n    ) {\n      throw Object.assign(new Error('minapp.authoring load/save/assets/preview/publish are required'), {\n",
          )
          replace_once(
              editor_path,
              "    els.startScene.disabled = value || !project || !workingDocument;\n",
              "    els.startScene.disabled = value || !project || !workingDocument;\n    els.assetId.disabled = value || !project || !workingDocument;\n    els.assetFile.disabled = value || !project || !workingDocument;\n    els.assetSave.disabled = value || !project || !workingDocument || dirty;\n",
          )

          asset_select = r'''
          function assetSelect(currentAssetId, kind, label, onChange) {
            const select = document.createElement('select');
            select.setAttribute('aria-label', label);
            const candidates = Object.entries(workingDocument.assets)
              .filter(([, asset]) => asset.kind === kind);
            for (const [assetId] of candidates) {
              const option = document.createElement('option');
              option.value = assetId;
              option.textContent = assetId;
              option.selected = assetId === currentAssetId;
              select.appendChild(option);
            }
            select.disabled = candidates.length === 0;
            select.addEventListener('change', () => onChange(select.value));
            return select;
          }

          function renderEditableAssetEvent(card, event) {
            if (event.type === 'background') {
              card.appendChild(assetSelect(event.asset, 'image', `${event.id} の背景素材`, (value) => {
                event.asset = value;
                markDirty();
              }));
              return true;
            }
            if (event.type === 'se') {
              card.appendChild(assetSelect(event.asset, 'audio', `${event.id} のSE素材`, (value) => {
                event.asset = value;
                markDirty();
              }));
              return true;
            }
            if (event.type === 'bgm' && event.action === 'play') {
              card.appendChild(assetSelect(event.asset, 'audio', `${event.id} のBGM素材`, (value) => {
                event.asset = value;
                markDirty();
              }));
              const loopLabel = document.createElement('label');
              loopLabel.className = 'inline-check';
              const checkbox = document.createElement('input');
              checkbox.type = 'checkbox';
              checkbox.checked = event.loop === true;
              checkbox.addEventListener('change', () => {
                event.loop = checkbox.checked;
                markDirty();
              });
              loopLabel.append(checkbox, document.createTextNode('ループ'));
              card.appendChild(loopLabel);
              return true;
            }
            return false;
          }
          '''
          replace_once(
              editor_path,
              "  function eventCard(event) {\n",
              asset_select + "\n  function eventCard(event) {\n",
          )
          replace_once(
              editor_path,
              "    if (event.type === 'dialogue') {\n",
              "    if (renderEditableAssetEvent(card, event)) return card;\n\n    if (event.type === 'dialogue') {\n",
          )

          new_render_assets = r'''  function clearAssetPreview() {
            if (assetPreviewUrl) {
              URL.revokeObjectURL(assetPreviewUrl);
              assetPreviewUrl = null;
            }
            els.assetPreview.replaceChildren();
          }

          async function previewAsset(assetId) {
            const descriptor = workingDocument.assets[assetId];
            if (!descriptor) throw Object.assign(new Error(`素材 ${assetId} がありません`), { code: 'asset_not_found' });
            const api = authoringApi();
            if (!api) throw Object.assign(new Error('Authoring bridge is unavailable'), { code: 'authoring_unavailable' });
            const result = await api.getAsset(descriptor.src);
            if (!result || !(result.bytes instanceof Uint8Array) || result.contentType !== descriptor.mime) {
              throw Object.assign(new Error('素材取得結果がNovel documentと一致しません'), { code: 'asset_response_mismatch' });
            }
            clearAssetPreview();
            assetPreviewUrl = URL.createObjectURL(new Blob([result.bytes], { type: result.contentType }));
            const label = document.createElement('strong');
            label.textContent = assetId;
            els.assetPreview.appendChild(label);
            if (descriptor.kind === 'image') {
              const image = document.createElement('img');
              image.src = assetPreviewUrl;
              image.alt = descriptor.alt || assetId;
              els.assetPreview.appendChild(image);
            } else {
              const audio = document.createElement('audio');
              audio.src = assetPreviewUrl;
              audio.controls = true;
              els.assetPreview.appendChild(audio);
            }
          }

          async function deleteOrphanAsset(path) {
            if (dirty) throw Object.assign(new Error('素材整理前に変更を保存してください'), { code: 'unsaved_changes' });
            if (Object.values(workingDocument.assets).some((asset) => asset.src === path)) {
              throw Object.assign(new Error('この素材pathはNovel documentから参照されています'), { code: 'asset_in_use' });
            }
            const api = authoringApi();
            const expectedRevision = project.draftRevision;
            const response = await api.deleteAsset(path, { expectedRevision });
            project.draftRevision = core.validateSaveResponse(response, expectedRevision, project.contentId);
            project.assets = core.deepClone(response.assets);
            previewedRevision = null;
            renderProject();
            setStatus(`未参照素材 ${path} を削除しました`, 'ok');
          }

          async function deleteLogicalAsset(assetId) {
            if (dirty) throw Object.assign(new Error('素材削除前に変更を保存してください'), { code: 'unsaved_changes' });
            const descriptor = workingDocument.assets[assetId];
            if (!descriptor) throw Object.assign(new Error(`素材 ${assetId} がありません`), { code: 'asset_not_found' });
            const refs = assetTools.references(workingDocument, assetId);
            if (refs.length > 0) {
              throw Object.assign(new Error(`素材 ${assetId} は使用中です: ${refs.join(', ')}`), { code: 'asset_in_use' });
            }
            const api = authoringApi();
            const nextDocument = core.deepClone(workingDocument);
            delete nextDocument.assets[assetId];
            formatApi.validateStory(nextDocument);

            let expectedRevision = project.draftRevision;
            const saveResponse = await api.save(nextDocument, { expectedRevision });
            project.draftRevision = core.validateSaveResponse(saveResponse, expectedRevision, project.contentId);
            project.assets = core.deepClone(saveResponse.assets);
            workingDocument = core.deepClone(nextDocument);
            previewedRevision = null;
            dirty = false;

            if (!assetTools.pathUsedByOtherDescriptor(workingDocument, assetId, descriptor.src) &&
                assetTools.serverAssetByPath(project.assets, descriptor.src)) {
              expectedRevision = project.draftRevision;
              const deleteResponse = await api.deleteAsset(descriptor.src, { expectedRevision });
              project.draftRevision = core.validateSaveResponse(deleteResponse, expectedRevision, project.contentId);
              project.assets = core.deepClone(deleteResponse.assets);
            }
            renderProject();
            setStatus(`素材 ${assetId} を削除しました`, 'ok');
          }

          async function saveAssetFromForm() {
            if (dirty) throw Object.assign(new Error('素材追加・差し替え前に変更を保存してください'), { code: 'unsaved_changes' });
            const file = els.assetFile.files && els.assetFile.files[0];
            if (!file) throw Object.assign(new Error('素材ファイルを選んでください'), { code: 'asset_file_required' });
            const assetId = assetTools.requireAssetId(els.assetId.value.trim());
            const previous = workingDocument.assets[assetId] || null;
            const descriptor = assetTools.descriptor(assetId, file.name, file.type, previous);
            const nextDocument = core.deepClone(workingDocument);
            nextDocument.assets[assetId] = descriptor;
            formatApi.validateStory(nextDocument);
            const bytes = new Uint8Array(await file.arrayBuffer());
            if (bytes.length === 0) throw Object.assign(new Error('空の素材ファイルは保存できません'), { code: 'empty_asset' });

            const api = authoringApi();
            let expectedRevision = project.draftRevision;
            setBusy(true);
            setStatus(`素材 ${assetId} を保存しています…`);
            const assetResponse = await api.saveAsset(descriptor.src, bytes, { expectedRevision });
            project.draftRevision = core.validateSaveResponse(assetResponse, expectedRevision, project.contentId);
            project.assets = core.deepClone(assetResponse.assets);

            expectedRevision = project.draftRevision;
            const documentResponse = await api.save(nextDocument, { expectedRevision });
            project.draftRevision = core.validateSaveResponse(documentResponse, expectedRevision, project.contentId);
            project.assets = core.deepClone(documentResponse.assets);
            workingDocument = core.deepClone(nextDocument);
            previewedRevision = null;
            dirty = false;

            if (previous && previous.src !== descriptor.src &&
                !assetTools.pathUsedByOtherDescriptor(workingDocument, assetId, previous.src) &&
                assetTools.serverAssetByPath(project.assets, previous.src)) {
              expectedRevision = project.draftRevision;
              const cleanupResponse = await api.deleteAsset(previous.src, { expectedRevision });
              project.draftRevision = core.validateSaveResponse(cleanupResponse, expectedRevision, project.contentId);
              project.assets = core.deepClone(cleanupResponse.assets);
            }

            els.assetId.value = '';
            els.assetFile.value = '';
            renderProject();
            setStatus(`素材 ${assetId} をDraftへ反映しました`, 'ok');
          }

          function renderAssets() {
            clearAssetPreview();
            els.assetList.replaceChildren();
            const logicalEntries = Object.entries(workingDocument.assets);
            const referencedPaths = new Set(logicalEntries.map(([, asset]) => asset.src));
            if (logicalEntries.length === 0 && project.assets.length === 0) {
              const empty = document.createElement('p');
              empty.textContent = '素材はまだありません';
              els.assetList.appendChild(empty);
              return;
            }

            for (const [assetId, asset] of logicalEntries) {
              const row = document.createElement('div');
              row.className = 'asset-row';
              const info = document.createElement('div');
              const title = document.createElement('strong');
              title.textContent = assetId;
              const meta = document.createElement('code');
              const stored = assetTools.serverAssetByPath(project.assets, asset.src);
              meta.textContent = `${asset.kind} · ${asset.src} · ${asset.mime}${stored ? ` · ${stored.bytes} bytes` : ' · server未保存'}`;
              info.append(title, meta);
              const actions = document.createElement('div');
              actions.className = 'asset-actions';
              const preview = document.createElement('button');
              preview.type = 'button';
              preview.className = 'mini-button';
              preview.textContent = '確認';
              preview.disabled = !stored || busy;
              preview.addEventListener('click', async () => {
                try { await previewAsset(assetId); }
                catch (error) { setStatus(formatError(error), 'error'); }
              });
              const fill = document.createElement('button');
              fill.type = 'button';
              fill.className = 'mini-button';
              fill.textContent = '差し替え';
              fill.disabled = busy || dirty;
              fill.addEventListener('click', () => {
                els.assetId.value = assetId;
                els.assetFile.click();
              });
              const remove = document.createElement('button');
              remove.type = 'button';
              remove.className = 'mini-button danger';
              remove.textContent = '削除';
              remove.disabled = busy || dirty;
              remove.addEventListener('click', async () => {
                try { await deleteLogicalAsset(assetId); }
                catch (error) { setBusy(false); setStatus(formatError(error), 'error'); }
              });
              actions.append(preview, fill, remove);
              row.append(info, actions);
              els.assetList.appendChild(row);
            }

            for (const serverAsset of project.assets) {
              if (referencedPaths.has(serverAsset.path)) continue;
              const row = document.createElement('div');
              row.className = 'asset-row orphan';
              const info = document.createElement('div');
              const title = document.createElement('strong');
              title.textContent = '未参照素材';
              const meta = document.createElement('code');
              meta.textContent = `${serverAsset.path} · ${serverAsset.bytes} bytes`;
              info.append(title, meta);
              const remove = document.createElement('button');
              remove.type = 'button';
              remove.className = 'mini-button danger';
              remove.textContent = '整理';
              remove.disabled = busy || dirty;
              remove.addEventListener('click', async () => {
                try { await deleteOrphanAsset(serverAsset.path); }
                catch (error) { setBusy(false); setStatus(formatError(error), 'error'); }
              });
              row.append(info, remove);
              els.assetList.appendChild(row);
            }
          }
          '''
          start = "  function renderAssets() {\n"
          end = "\n  async function initializeEmptyProject(api) {\n"
          p = Path(editor_path)
          text = p.read_text()
          if text.count(start) != 1 or text.count(end) != 1:
              raise RuntimeError('editor.js renderAssets anchors changed')
          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)
          p.write_text(before + new_render_assets + "\n  async function initializeEmptyProject(api) {\n" + after)

          replace_once(
              editor_path,
              "  els.save.addEventListener('click', async () => {\n",
              "  els.assetSave.addEventListener('click', async () => {\n    try {\n      await saveAssetFromForm();\n    } catch (error) {\n      setBusy(false);\n      setStatus(formatError(error), 'error');\n      console.error(error);\n    }\n  });\n  els.assetFile.addEventListener('change', () => {\n    if (els.assetFile.files && els.assetFile.files[0] && els.assetId.value.trim() !== '') {\n      setStatus(`素材 ${els.assetId.value.trim()} を「追加 / 差し替え」で反映できます`, 'waiting');\n    }\n  });\n  els.save.addEventListener('click', async () => {\n",
          )

          html_path = 'novel_editor/index.html'
          replace_once(
              html_path,
              "    #asset-list { display: grid; gap: 8px; }\n",
              "    #asset-list { display: grid; gap: 8px; }\n    .asset-form { display: grid; gap: 8px; margin: 10px 0 12px; }\n    .asset-form label { margin: 0; }\n    .asset-row { display: grid; gap: 7px; padding: 9px; border: 1px solid #ddd1e7; border-radius: 10px; background: white; }\n    .asset-row > div:first-child { display: grid; gap: 4px; min-width: 0; }\n    .asset-row.orphan { border-style: dashed; background: #fff9ed; }\n    .asset-actions { display: flex; flex-wrap: wrap; gap: 6px; }\n    .mini-button { border: 0; border-radius: 9px; padding: 6px 9px; background: #eee5f7; color: #4a355d; font-size: 12px; font-weight: 700; }\n    .mini-button.danger { background: #ffe3e3; color: #8a2222; }\n    #asset-preview { display: grid; gap: 7px; margin-top: 10px; }\n    #asset-preview img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 10px; background: #f3eef7; }\n    #asset-preview audio { width: 100%; }\n    .inline-check { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 12px; }\n    .inline-check input { width: auto; }\n",
          )
          old_material = '''        <section class="side-card">
          <h3>素材</h3>
          <div id="asset-list"><p>未読込</p></div>
        </section>'''
          new_material = '''        <section class="side-card">
          <h3>素材</h3>
          <div class="asset-form">
            <label>
              素材ID
              <input id="asset-id" type="text" maxlength="64" placeholder="classroom / akari_smile / bgm01" disabled>
            </label>
            <label>
              画像・BGM・SEファイル
              <input id="asset-file" type="file" accept=".png,.jpg,.jpeg,.gif,.webp,.mp3,.m4a,.ogg,.wav,image/png,image/jpeg,image/gif,image/webp,audio/mpeg,audio/mp4,audio/ogg,audio/wav" disabled>
            </label>
            <button id="asset-save-button" class="secondary" type="button" disabled>追加 / 差し替え</button>
            <p>同じ素材IDを指定すると差し替えます。素材変更はその場でDraftへ保存され、revision競合時は自動上書きしません。</p>
          </div>
          <div id="asset-list"><p>未読込</p></div>
          <div id="asset-preview"></div>
        </section>'''
          replace_once(html_path, old_material, new_material)
          replace_once(
              html_path,
              "            stable scene/event/choice IDと遷移先は表示のみです。現在編集できるのはタイトル、開始シーン、セリフ、選択肢ラベル、ENDラベルです。\n",
              "            stable IDは維持します。タイトル、開始シーン、セリフ、選択肢ラベル、ENDラベルに加え、背景/BGM/SEの素材選択と画像・音声素材の追加・差し替え・削除ができます。\n",
          )
          replace_once(
              html_path,
              "  <script src=\"story-validator.js\"></script>\n  <script src=\"editor-core.js\"></script>\n  <script src=\"editor.js\"></script>\n",
              "  <script src=\"story-validator.js\"></script>\n  <script src=\"editor-core.js\"></script>\n  <script src=\"asset-tools.js\"></script>\n  <script src=\"editor.js\"></script>\n",
          )

          # Add asset metadata coverage to Editor core tests.
          tests = Path('novel_editor/test_editor_core.js')
          text = tests.read_text()
          marker = "{\n  const preview = {\n"
          if text.count(marker) != 1:
              raise RuntimeError('test_editor_core preview marker changed')
          asset_test = r'''{
            const response = {
              content_id: '1'.repeat(32),
              group_id: '2'.repeat(32),
              content_format: 'minapp/novel@1',
              status: 'draft',
              draft_revision: 13,
              assets: [{
                path: 'assets/classroom.png',
                sha256: 'a'.repeat(64),
                bytes: 123,
                content_type: 'image/png',
                revision: 13,
              }],
              created_at: '2026-09-06T10:00:00Z',
              updated_at: '2026-09-06T10:11:00Z',
            };
            assert.strictEqual(core.validateSaveResponse(response, 12, '1'.repeat(32)), 13);
            expectCode(
              () => core.validateSaveResponse({ ...response, assets: [{ ...response.assets[0], extra: true }] }, 12, '1'.repeat(32)),
              'invalid_authoring_response',
            );
          }

          '''
          tests.write_text(text.replace(marker, asset_test + marker, 1))

          workflow = '.github/workflows/novel-player.yml'
          replace_once(
              workflow,
              "      - name: Test Editor Authoring contract\n        run: node novel_editor/test_editor_core.js\n",
              "      - name: Test Editor Authoring contract\n        run: node novel_editor/test_editor_core.js\n      - name: Test Novel asset helpers\n        run: node novel_editor/test_asset_tools.js\n",
          )
          replace_once(
              workflow,
              "          node --check novel_editor/editor-core.js\n          node --check novel_editor/editor.js\n",
              "          node --check novel_editor/editor-core.js\n          node --check novel_editor/asset-tools.js\n          node --check novel_editor/editor.js\n",
          )

          Path('.github/workflows/novel-asset-ui-apply.yml').unlink()

      - name: Test Novel implementation
        run: |
          node novel_starter/test_story_validator.js
          node novel_starter/test_player_runtime_ready.js
          node novel_editor/test_editor_core.js
          node novel_editor/test_asset_tools.js
          node --check novel_starter/story-validator.js
          node --check novel_starter/player.js
          node --check novel_editor/story-validator.js
          node --check novel_editor/editor-core.js
          node --check novel_editor/asset-tools.js
          node --check novel_editor/editor.js

      - name: Commit asset UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "#1 add Novel Authoring asset editing UI"
          git push origin HEAD:chatgpt/novel-v1-player-foundation
