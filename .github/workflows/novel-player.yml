name: Novel Player / Editor CI

on:
  push:
    paths:
      - 'novel_starter/**'
      - 'novel_editor/**'
      - '.github/workflows/novel-player.yml'
  pull_request:
    paths:
      - 'novel_starter/**'
      - 'novel_editor/**'
      - '.github/workflows/novel-player.yml'

permissions:
  contents: read

jobs:
  novel-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Checkout generic Host reference
        uses: actions/checkout@v4
        with:
          repository: kaeruko/minapp
          ref: f81079199057323f057534db1886fae66a7e49de
          path: external/minapp
      - name: Validate story format
        run: node novel_starter/test_story_validator.js
      - name: Test Hosted runtime readiness
        run: node novel_starter/test_player_runtime_ready.js
      - name: Test Editor Authoring contract
        run: node novel_editor/test_editor_core.js
      - name: Test Novel asset helpers
        run: node novel_editor/test_asset_tools.js
      - name: Test Novel Editor recovery
        run: node novel_editor/test_editor_resilience.js
      - name: Test real Novel through generic Host Authoring
        run: python novel_editor/test_host_authoring_roundtrip.py
      - name: Check JavaScript syntax
        run: |
          node --check novel_starter/story-validator.js
          node --check novel_starter/player.js
          node --check novel_editor/story-validator.js
          node --check novel_editor/editor-core.js
          node --check novel_editor/asset-tools.js
          node --check novel_editor/editor-resilience.js
          node --check novel_editor/editor.js
