<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>晩酌予算 | みんアプ工房</title>
  <style>
    :root { font-family: system-ui, -apple-system, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      color: #282520; background: #faf2e5; --navy: #273e5a; --red: #bd3b2c; --brown: #65452a; --line: #decaad; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; background: linear-gradient(#fcf6eb,#f6e9d4); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled, input:disabled { opacity: .52; cursor: not-allowed; }
    .app { width: min(100%, 520px); margin: 0 auto; padding-bottom: max(26px, env(safe-area-inset-bottom)); }
    header { background: var(--navy); color: white; padding: max(18px, env(safe-area-inset-top)) 20px 20px; }
    .eyebrow { margin: 0; color: #e8c99d; font-size: 12px; letter-spacing: .16em; font-weight: 800; }
    h1 { font-size: 28px; margin: 6px 0 4px; letter-spacing: .04em; }
    .sub { margin: 0; font-size: 13px; opacity: .9; }
    main { padding: 16px 14px 0; display: grid; gap: 15px; }
    .paper { background: #fffaf1; border: 1px solid var(--line); border-radius: 17px; padding: 17px;
      box-shadow: 0 4px 0 #b58b5711; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .month-label { color: var(--brown); font-size: 14px; font-weight: 800; }
    input[type="month"] { width: 174px; max-width: 65%; font-size: 14px; }
    input { min-width: 0; width: 100%; padding: 11px 12px; background: #fff;
      border: 1px solid #cbb798; border-radius: 10px; color: #282520; font-size: 16px; }
    input:focus-visible, button:focus-visible { outline: 3px solid #e4a445; outline-offset: 2px; }
    .summary { background: #fff1d8; border: 2px solid #d5b17c; }
    .headline { color: var(--brown); font-size: 13px; font-weight: 800; }
    .visits { display: flex; gap: 7px; align-items: baseline; margin: 9px 0; color: var(--red); }
    .visits strong { font-size: clamp(29px, 9vw, 46px); line-height: 1.1; }
    .visits span { font-size: 17px; font-weight: 800; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
    .stat { background: #fffaf2; border-radius: 10px; padding: 10px 6px; text-align: center; }
    .stat small { display: block; color: #74563c; font-size: 11px; margin-bottom: 5px; }
    .stat strong { display: block; font-size: clamp(12px, 3.8vw, 17px); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    .negative { color: #b52d22; }
    .track { height: 9px; border-radius: 99px; overflow: hidden; background: #ddcfb9; margin-top: 13px; }
    .fill { height: 100%; width: 0; background: #cf9237; transition: width .2s; }
    .fill.over { background: var(--red); }
    h2 { margin: 0 0 13px; color: var(--brown); font-size: 18px; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    label { display: block; font-size: 13px; color: #65452a; font-weight: 800; }
    label input { display: block; margin-top: 6px; }
    .expense-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .note { grid-column: 1 / -1; }
    .action { width: 100%; border: 0; border-radius: 12px; background: var(--red);
      color: #fff; padding: 13px 16px; font-size: 15px; font-weight: 850; margin-top: 13px; min-height: 48px; }
    .action.secondary { background: var(--navy); }
    .smallprint { color: #7d664f; font-size: 12px; line-height: 1.6; margin: 10px 0 0; }
    .status { border-radius: 10px; padding: 11px 13px; background: #eaf1e7;
      color: #315a2d; font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
    .status.error { background: #f9dfd9; color: #9b261f; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; border-top: 1px dashed #d6c3a5; padding: 11px 0; }
    li:first-child { border-top: 0; }
    .entry-copy { flex: 1; min-width: 0; }
    .entry-date { display: block; font-size: 11px; color: #775e46; }
    .entry-note { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
    .entry-amount { white-space: nowrap; font-size: 15px; font-weight: 850; font-variant-numeric: tabular-nums; }
    .delete { flex: 0 0 auto; border: 1px solid #bf8c82; border-radius: 9px; background: #fff8f5;
      color: #a33c2d; padding: 9px 10px; font-size: 12px; font-weight: 800; min-height: 40px; }
    .empty { color: #806a55; font-size: 13px; line-height: 1.6; text-align: center; padding: 10px 0 4px; }
    footer { color: #816c54; font-size: 11px; padding: 18px 20px; text-align: center; }
    @media (max-width: 340px) { .paper { padding: 12px; } .stat { padding: 8px 3px; } .stats { gap: 5px; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <p class="eyebrow">MINAPP KOBO / 小さな家計道具</p>
      <h1>🍺 晩酌予算</h1>
      <p class="sub">今月あと何回、楽しめる？</p>
    </header>
    <main>
      <div class="paper row">
        <label class="month-label" for="month">見る月を選ぶ</label>
        <input id="month" type="month" min="2000-01" max="2099-12" aria-label="見る月を選ぶ">
      </div>
      <section class="paper summary" aria-label="今月の予算状況">
        <div class="headline" id="current-month">今月の見通し</div>
        <div class="visits"><span>あと</span><strong id="visits">—</strong><span>回分</span></div>
        <div class="smallprint" id="estimate">月の予算を設定すると計算できます。</div>
        <div class="stats">
          <div class="stat"><small>月の予算</small><strong id="budget-total">未設定</strong></div>
          <div class="stat"><small>使った金額</small><strong id="spent-total">0円</strong></div>
          <div class="stat"><small>残り</small><strong id="remaining-total">—</strong></div>
        </div>
        <div class="track" role="progressbar" aria-label="予算の使用率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="fill" id="progress-fill"></div></div>
      </section>
      <p class="status" id="status" role="status" aria-live="polite">データを読み込み中…</p>
      <section class="paper">
        <h2>予算を決める</h2>
        <form id="settings-form">
          <div class="fields">
            <label>毎月の予算（円）<input id="monthly-budget" type="number" inputmode="numeric" min="1" max="10000000" step="1" placeholder="例：12000" required disabled></label>
            <label>1回の目安（円）<input id="visit-cost" type="number" inputmode="numeric" min="1" max="10000000" step="1" required disabled></label>
          </div>
          <button class="action secondary" id="save-settings" type="submit" disabled>予算を保存</button>
        </form>
        <p class="smallprint">設定した月予算と1回の目安は、どの月にも共通で使います。</p>
      </section>
      <section class="paper">
        <h2>支出を記録する</h2>
        <form id="expense-form">
          <div class="expense-fields">
            <label>日付<input id="spent-date" type="date" required disabled></label>
            <label>金額（円）<input id="spent-amount" type="number" inputmode="numeric" min="1" max="10000000" step="1" placeholder="例：1800" required disabled></label>
            <label class="note">ひとこと（任意）<input id="spent-note" type="text" maxlength="40" placeholder="例：近所の居酒屋" disabled></label>
          </div>
          <button class="action" id="add-expense" type="submit" disabled>＋ 支出を記録</button>
        </form>
      </section>
      <section class="paper">
        <h2>この月の記録</h2>
        <ul id="expense-list"></ul>
        <p id="no-expenses" class="empty">まだ記録がありません。</p>
      </section>
    </main>
    <footer>データはみんアプ工房の個人用保存領域に保存します。</footer>
  </div>
  <script src="budget.js"></script>
  <script src="app.js"></script>
</body>
</html>
